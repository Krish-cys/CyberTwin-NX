name: cybertwin
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.1.1
      binds:
      - configs/r1/daemons:/etc/frr/daemons
      - configs/r1/frr.conf:/etc/frr/frr.conf
      exec:
      - sysctl -w net.ipv4.ip_forward=1
      - ip addr add 10.255.1.1/30 dev eth1
      - ip addr add 10.255.3.1/30 dev eth2
      - ip addr add 10.1.1.1/24 dev eth3
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.1.1
      binds:
      - configs/r2/daemons:/etc/frr/daemons
      - configs/r2/frr.conf:/etc/frr/frr.conf
      exec:
      - sysctl -w net.ipv4.ip_forward=1
      - ip addr add 10.255.1.2/30 dev eth1
      - ip addr add 10.255.2.1/30 dev eth2
      - ip addr add 10.255.4.1/30 dev eth3
    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.1.1
      binds:
      - configs/r3/daemons:/etc/frr/daemons
      - configs/r3/frr.conf:/etc/frr/frr.conf
      exec:
      - sysctl -w net.ipv4.ip_forward=1
      - ip addr add 10.255.2.2/30 dev eth1
      - ip addr add 10.255.3.2/30 dev eth2
      - ip addr add 10.255.5.1/30 dev eth3
      - ip addr add 10.1.2.1/24 dev eth4
    s1:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set eth1 master br0
      - ip link set eth2 master br0
      - ip link set eth3 master br0
      - ip link set eth4 master br0
      - ip link set eth1 up
      - ip link set eth2 up
      - ip link set eth3 up
      - ip link set eth4 up
    s2:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set eth1 master br0
      - ip link set eth2 master br0
      - ip link set eth3 master br0
      - ip link set eth4 master br0
      - ip link set eth1 up
      - ip link set eth2 up
      - ip link set eth3 up
      - ip link set eth4 up
    h1:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip addr add 10.1.1.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.1.1
    h2:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip addr add 10.1.1.11/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.1.1
    h3:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip addr add 10.1.1.12/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.1.1
    h4:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip addr add 10.1.2.10/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.2.1
    h5:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip addr add 10.1.2.11/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.2.1
    h6:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip addr add 10.1.2.12/24 dev eth1
      - ip route add 10.0.0.0/8 via 10.1.2.1
    srv1:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip addr add 10.255.4.2/30 dev eth1
      - ip route add 10.0.0.0/8 via 10.255.4.1
    srv2:
      kind: linux
      image: wbitt/network-multitool:latest
      exec:
      - ip addr add 10.255.5.2/30 dev eth1
      - ip route add 10.0.0.0/8 via 10.255.5.1
  links:
  - endpoints:
    - r1:eth1
    - r2:eth1
  - endpoints:
    - r2:eth2
    - r3:eth1
  - endpoints:
    - r1:eth2
    - r3:eth2
  - endpoints:
    - r2:eth3
    - srv1:eth1
  - endpoints:
    - r3:eth3
    - srv2:eth1
  - endpoints:
    - r1:eth3
    - s1:eth1
  - endpoints:
    - s1:eth2
    - h1:eth1
  - endpoints:
    - s1:eth3
    - h2:eth1
  - endpoints:
    - s1:eth4
    - h3:eth1
  - endpoints:
    - r3:eth4
    - s2:eth1
  - endpoints:
    - s2:eth2
    - h4:eth1
  - endpoints:
    - s2:eth3
    - h5:eth1
  - endpoints:
    - s2:eth4
    - h6:eth1
